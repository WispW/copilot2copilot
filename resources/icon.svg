<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- 浅色圆角底 -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="#F2F4F7"/>

  <!-- 主体轮廓（护目镜风格，原创比例） -->
  <g fill="#333A45">
    <!-- 两侧外扩耳罩 -->
    <rect x="40" y="110" width="48" height="64" rx="22"/>
    <rect x="168" y="110" width="48" height="64" rx="22"/>
    <!-- 主体下块 -->
    <rect x="64" y="94" width="128" height="94" rx="36"/>
    <!-- 上方两个凸起（眉骨） -->
    <rect x="68" y="70" width="58" height="58" rx="19"/>
    <rect x="130" y="70" width="58" height="58" rx="19"/>
    <!-- 两凸起之间的连接 -->
    <rect x="96" y="84" width="64" height="44" rx="20"/>
  </g>

  <!-- 眼片（挖空效果：以底色填充） -->
  <rect x="80" y="82" width="38" height="36" rx="13" fill="#F2F4F7"/>
  <rect x="138" y="82" width="38" height="36" rx="13" fill="#F2F4F7"/>

  <!-- 下方面板（挖空） -->
  <rect x="84" y="138" width="88" height="38" rx="15" fill="#F2F4F7"/>

  <!-- 面板内细节（与官方图案不同） -->
  <circle cx="118" cy="157" r="6" fill="#333A45"/>
  <rect x="132" y="151" width="26" height="12" rx="6" fill="#333A45"/>
</svg>
